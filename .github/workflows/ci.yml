name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64]
        configuration: [Debug]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore SmrtPad.slnx

      - name: Build
        run: dotnet build SmrtPad.slnx --configuration ${{ matrix.configuration }} --no-restore -p:Platform=${{ matrix.platform }}

      - name: Test with coverage
        run: dotnet test SmrtPad.Tests/SmrtPad.Tests.csproj --configuration ${{ matrix.configuration }} --no-build -p:Platform=${{ matrix.platform }} --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.configuration }}
          path: ./TestResults